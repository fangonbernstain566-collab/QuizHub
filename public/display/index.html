<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuizHub — Display</title>
<link rel="stylesheet" href="/shared/shared.css" />
<style>
  body { display: flex; flex-direction: column; align-items: center; }
  .container { max-width: 1400px; width: 100%; }
  #roundLabel { font-size: 1.2rem; color: var(--muted); text-align: center; }
  #questionText { font-size: 2.4rem; font-weight: 800; text-align: center; margin: 20px 0; }
  #timerWrap { text-align: center; margin-bottom: 20px; }
  #timer { font-size: 5rem; }
  #idleMsg { text-align: center; font-size: 1.6rem; color: var(--muted); margin: 60px 0; }
  .answer-tile .points { font-weight: 800; color: var(--accent); }
  #scoreboardCard table { font-size: 1.3rem; }
  #scoreboardCard td:last-child, #scoreboardCard th:last-child { text-align: right; }
</style>
</head>
<body>
<div class="container">
  <h1 style="text-align:center;">QuizHub</h1>

  <div id="idleMsg" style="display:none;">Waiting for the host to start the next question…</div>

  <div id="questionCard" class="card" style="display:none;">
    <div id="roundLabel"></div>
    <div id="questionText"></div>
    <div id="timerWrap"><div class="timer" id="timer"></div></div>
    <div class="row" style="justify-content:center;">
      <span class="badge" id="progressBadge"></span>
    </div>
  </div>

  <div id="revealCard" class="card" style="display:none;">
    <h2>Answers</h2>
    <div class="grid" id="revealGrid"></div>
  </div>

  <div id="scoreboardCard" class="card">
    <h2>Scoreboard</h2>
    <table>
      <thead><tr><th>Team</th><th>Score</th></tr></thead>
      <tbody id="scoreboardBody"></tbody>
    </table>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="display.js"></script>
</body>
</html>
