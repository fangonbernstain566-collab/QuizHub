<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>QuizHub — Play</title>
<link rel="stylesheet" href="/shared/shared.css" />
<style>
  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    width: 100%;
    padding: 4vh 24px 40px;
  }

  h1 { font-size: 18px; margin-bottom: 4vh; }

  #gameScreen {
    display: none;
    flex: 1;
    flex-direction: column;
  }

  /* Join screen */
  #joinScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 32px;
  }
  #joinScreen h2 { font-size: 14px; margin-bottom: 8px; }
  #joinScreen p.muted { font-size: 15px; margin-bottom: 28px; }
  #joinScreen label { font-size: 12px; margin-bottom: 8px; }
  #joinScreen input {
    padding: 16px 16px;
    font-size: 17px;
  }
  #joinScreen .col { gap: 20px; }
  #joinScreen button {
    padding: 16px;
    font-size: 14px;
    margin-top: 4px;
  }

  /* Meta bar */
  .meta-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: var(--muted);
    padding: 16px 20px;
  }
  .meta-bar strong { color: var(--text); font-weight: 700; }

  /* Game card */
  #gameCard {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 28px 24px;
  }

  .timer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  #phaseBadge { font-size: 13px; padding: 6px 14px; }
  #timer { font-size: 3.5rem; }

  .question-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  #roundLabel {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  #difficultyBadge { font-size: 11px; padding: 4px 10px; }

  #questionText {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.35;
  }

  #status {
    min-height: 20px;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  #answerButtons {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 16px;
  }

  .answer-btn {
    flex: 1;
    min-height: 100px;
    font-size: 2rem;
    font-weight: 700;
  }

  .answer-btn.selected {
    outline: 4px solid var(--accent, #4f7cff);
    outline-offset: -4px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>QuizHub</h1>

  <!-- Join Screen -->
  <div id="joinScreen" class="card">
    <h2>Join your team</h2>
    <p class="muted">Enter your name and the team name given to you by the game master.</p>
    <div class="col">
      <div>
        <label for="playerName">Your name</label>
        <input type="text" id="playerName" placeholder="Alex" maxlength="30" autocomplete="off" />
      </div>
      <div>
        <label for="teamName">Team name</label>
        <input type="text" id="teamName" placeholder="Trivia Nerds" maxlength="40" autocomplete="off" />
      </div>
      <button id="joinBtn" class="primary" style="width: 100%;">Join game</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen">
    <div class="card meta-bar">
      <span>Playing as <strong id="myPlayerName"></strong> on <strong id="myTeamName"></strong></span>
    </div>

    <div class="card" id="gameCard">
      <div class="timer-row">
        <span class="badge" id="phaseBadge">Waiting</span>
        <span class="timer" id="timer"></span>
      </div>

      <div class="question-meta" id="questionMeta" style="display: none;">
        <span id="roundLabel"></span>
        <span class="badge" id="difficultyBadge"></span>
      </div>
      <div id="questionText" class="muted">Waiting for the host to start a question…</div>
      <div id="status"></div>

      <div id="answerButtons">
        <button id="answerA" class="answer-btn" disabled>A</button>
        <button id="answerB" class="answer-btn" disabled>B</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="play.js"></script>
</body>
</html>
