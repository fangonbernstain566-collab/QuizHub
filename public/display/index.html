<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuizHub — Display</title>
<link rel="stylesheet" href="/shared/shared.css" />
<style>
  html, body {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 3vh 4vw;
  }

  .container {
    max-width: 1800px;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 28px;
    letter-spacing: 0.18em;
    margin-bottom: 3vh;
  }

  #idleMsg {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 2.4rem;
    font-weight: 600;
    color: var(--muted);
  }

  #questionCard {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 5vh 6vw;
    margin-bottom: 3vh;
  }

  #roundLabel {
    font-size: 20px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--muted);
  }

  #questionText {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 800;
    color: var(--text);
    margin-bottom: 5vh;
    line-height: 1.25;
    letter-spacing: -0.01em;
    max-width: 1400px;
  }

  .question-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 2vh;
  }
  #difficultyBadge { font-size: 15px; padding: 6px 16px; }

  #statusLine {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 3vh;
  }

  #timerWrap { margin-bottom: 3vh; }
  #timer { font-size: clamp(6rem, 14vw, 12rem); }

  #progressBadge { font-size: 18px; padding: 10px 24px; }

  #revealCard {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 4vh 4vw;
    margin-bottom: 3vh;
  }
  #revealCard h2 { font-size: 20px; margin-bottom: 3vh; }

  #revealGrid {
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    flex: 1;
  }

  .answer-tile { padding: 24px; }
  .answer-tile .team-label { font-size: 15px; margin-bottom: 10px; }
  .answer-tile .answer-text { font-size: 24px; font-weight: 600; color: var(--text); }
  .answer-tile .points.pending {
    color: var(--muted);
    font-family: var(--font-display);
    font-weight: 500;
    font-style: italic;
  }

  #scoreboardCard { padding: 4vh 4vw; }
  #scoreboardCard h2 { font-size: 20px; margin-bottom: 2.5vh; }

  #scoreboardCard table { font-size: 22px; }
  #scoreboardCard th { font-size: 15px; padding: 14px 10px; }
  #scoreboardCard td { padding: 18px 10px; }
  #scoreboardCard td:last-child,
  #scoreboardCard th:last-child {
    text-align: right;
    font-family: var(--font-mono);
    font-weight: 700;
  }

  .rank-cell {
    font-family: var(--font-mono);
    color: var(--muted);
    font-size: 18px;
    width: 44px;
  }

  /* ---- Floating leaderboard (pinned top-right during a live question) ---- */
  #floatingLeaderboard {
    display: none;
    position: fixed;
    top: 24px;
    right: 24px;
    width: 260px;
    max-height: 60vh;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }

  #floatingLeaderboard .fl-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
  }

  #floatingLeaderboard .fl-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
  }

  #floatingLeaderboard .fl-rank {
    font-family: var(--font-mono);
    color: var(--muted);
    font-size: 11px;
    width: 16px;
    flex-shrink: 0;
  }

  #floatingLeaderboard .fl-name {
    flex: 1;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #floatingLeaderboard .fl-score {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--text);
    font-size: 13px;
  }

  @media (max-width: 720px) {
    #floatingLeaderboard { width: 200px; top: 12px; right: 12px; padding: 10px 12px; }
  }
</style>
</head>
<body>
<div id="floatingLeaderboard">
  <div class="fl-title">Leaderboard</div>
  <div id="floatingLeaderboardBody"></div>
</div>

<div class="container">
  <h1 style="text-align: center;">QuizHub</h1>

  <div id="idleMsg" style="display: none;">Waiting for the host to start the next question…</div>

  <div id="questionCard" class="card" style="display: none;">
    <div class="question-meta">
      <div id="roundLabel"></div>
      <span class="badge" id="difficultyBadge"></span>
    </div>
    <div id="questionText"></div>
    <div id="statusLine"></div>
    <div id="timerWrap">
      <div class="timer" id="timer"></div>
    </div>
    <div>
      <span class="badge active" id="progressBadge"></span>
    </div>
  </div>

  <div id="revealCard" class="card" style="display: none;">
    <h2>Answers</h2>
    <div class="grid" id="revealGrid"></div>
  </div>

  <div id="scoreboardCard" class="card">
    <h2>Scoreboard</h2>
    <table>
      <thead>
        <tr>
          <th style="width: 44px;"></th>
          <th>Team</th>
          <th style="text-align: right;">Score</th>
        </tr>
      </thead>
      <tbody id="scoreboardBody"></tbody>
    </table>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="display.js"></script>
</body>
</html>
