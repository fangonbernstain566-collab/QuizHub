<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>

<title>QuizHub — Play</title>

<link rel="stylesheet" href="/shared/shared.css" />

<style>

  html,
  body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;

    background:
      linear-gradient(
        180deg,
        var(--navy-top) 0%,
        var(--navy-bottom) 100%
      );

    color: var(--text);
  }


  .container {
    flex: 1;
    display: flex;
    flex-direction: column;

    max-width: 640px;
    width: 100%;

    padding: 4vh 24px 40px;
  }


  /* =====================================================
     HEADER
     ===================================================== */

  h1 {
    font-size: 18px;
    font-weight: 800;

    color: #FFFFFF;

    text-align: center;

    letter-spacing: 0.14em;

    margin-bottom: 4vh;

    padding: 14px 20px;

    border: 1px solid rgba(255, 255, 255, 0.25);

    border-radius: var(--radius);

    background: rgba(255, 255, 255, 0.08);
  }


  /* =====================================================
     GAME SCREEN
     ===================================================== */

  #gameScreen {
    display: none;

    flex: 1;
    flex-direction: column;
  }


  /* =====================================================
     JOIN SCREEN
     ===================================================== */

  #joinScreen {
    flex: 1;

    display: flex;
    flex-direction: column;

    justify-content: center;

    max-width: 480px;
    width: 100%;

    margin: 0 auto;

    padding: 40px 32px;

    background: #FFFFFF;

    border: 1px solid var(--gold);

    box-shadow:
      0 12px 30px rgba(0, 0, 0, 0.18);
  }


  #joinScreen h2 {
    font-size: 14px;

    color: var(--primary);

    margin-bottom: 8px;
  }


  #joinScreen p.muted {
    font-size: 15px;

    margin-bottom: 28px;

    color: var(--muted);
  }


  #joinScreen label {
    font-size: 12px;

    margin-bottom: 8px;
  }


  #joinScreen input {
    padding: 16px;

    font-size: 17px;
  }


  #joinScreen .col {
    gap: 20px;
  }


  #joinScreen button {
    padding: 16px;

    font-size: 14px;

    margin-top: 4px;
  }


  /* =====================================================
     META BAR
     ===================================================== */

  .meta-bar {
    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 14px;

    color: #FFFFFF;

    padding: 16px 20px;

    background: var(--primary);

    border: 1px solid rgba(255, 255, 255, 0.18);

    box-shadow:
      0 8px 20px rgba(0, 0, 0, 0.12);
  }


  .meta-bar strong {
    color: #FFFFFF;

    font-weight: 700;
  }


  /* =====================================================
     GAME CARD
     ===================================================== */

  #gameCard {
    flex: 1;

    display: flex;
    flex-direction: column;

    padding: 28px 24px;

    /* CHANGED FROM BLUE TO WHITE */
    background: #FFFFFF;

    border: 1px solid var(--gold);

    box-shadow:
      0 12px 30px rgba(0, 0, 0, 0.16);
  }


  /* =====================================================
     TIMER
     ===================================================== */

  .timer-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 24px;
  }


  #phaseBadge {
    font-size: 13px;

    padding: 6px 14px;
  }


  #timer {
    font-size: 3.5rem;

    color: var(--primary);
  }


  .timer.low {
    color: var(--accent) !important;
  }


  /* =====================================================
     QUESTION META
     ===================================================== */

  .question-meta {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 12px;
  }


  #roundLabel {
    font-size: 12px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.1em;

    color: var(--primary);
  }


  #difficultyBadge {
    font-size: 11px;

    padding: 4px 10px;
  }


  /* =====================================================
     QUESTION
     ===================================================== */

  #questionText {
    font-size: 1.6rem;

    font-weight: 700;

    color: var(--text);

    margin-bottom: 10px;

    line-height: 1.35;
  }


  #status {
    min-height: 20px;

    font-size: 14px;

    color: var(--muted);

    margin-bottom: 20px;
  }


  /* =====================================================
     A / B ANSWER BUTTONS
     ===================================================== */

  #answerButtons {
    flex: 1;

    display: flex;
    flex-direction: column;

    gap: 16px;

    margin-top: 5px;
  }


  .answer-btn {
    flex: 1;

    min-height: 100px;

    font-size: 2rem;
    font-weight: 700;

    color: var(--primary);

    background: #FFFFFF;

    border: 2px solid var(--line-soft);

    border-radius: var(--radius);

    transition:
      border-color 0.15s,
      box-shadow 0.15s,
      background 0.15s,
      color 0.15s;
  }


  .answer-btn:disabled {
    background: #F4F4F4;

    cursor: not-allowed;

    opacity: 0.7;
  }


  .answer-btn.selected {
    background: var(--primary);

    border-color: var(--primary);

    color: #FFFFFF;
  }


  /* =====================================================
     MOBILE
     ===================================================== */

  @media (max-width: 520px) {

    .container {
      padding:
        20px
        14px
        30px;
    }


    #gameCard {
      padding: 22px 18px;
    }


    #questionText {
      font-size: 1.4rem;
    }


    .answer-btn {
      min-height: 84px;

      font-size: 1.6rem;
    }


    #timer {
      font-size: 2.8rem;
    }

  }

</style>
</head>


<body>

<div class="container">


  <!-- ===================================================
       HEADER
       =================================================== -->

  <h1>QuizHub</h1>


  <!-- ===================================================
       JOIN SCREEN
       =================================================== -->

  <div id="joinScreen" class="card">

    <h2>Join your team</h2>

    <p class="muted">
      Enter your name, team name, and the team password given to you by the game master.
    </p>

    <div class="col">

      <div>

        <label for="playerName">
          Your name
        </label>

        <input
          type="text"
          id="playerName"
          placeholder="Alex"
          maxlength="30"
          autocomplete="off"
        />

      </div>


      <div>

        <label for="teamName">
          Team name
        </label>

        <input
          type="text"
          id="teamName"
          placeholder="Trivia Nerds"
          maxlength="40"
          autocomplete="off"
        />

      </div>


      <div>

        <label for="teamPassword">
          Team password
        </label>

        <input
          type="password"
          id="teamPassword"
          placeholder="Given to you by the game master"
          maxlength="40"
          autocomplete="off"
        />

      </div>


      <button
        id="joinBtn"
        class="primary"
        style="width: 100%;"
      >
        Join game
      </button>

    </div>

  </div>


  <!-- ===================================================
       GAME SCREEN
       =================================================== -->

  <div id="gameScreen">


    <!-- Player / Team -->

    <div class="card meta-bar">

      <span>
        Playing as
        <strong id="myPlayerName"></strong>
        on
        <strong id="myTeamName"></strong>
      </span>

    </div>


    <!-- Game -->

    <div class="card" id="gameCard">


      <!-- Timer -->

      <div class="timer-row">

        <span
          class="badge"
          id="phaseBadge"
        >
          Waiting
        </span>

        <span
          class="timer"
          id="timer"
        ></span>

      </div>


      <!-- Question Meta -->

      <div
        class="question-meta"
        id="questionMeta"
        style="display: none;"
      >

        <span id="roundLabel"></span>

        <span
          class="badge"
          id="difficultyBadge"
        ></span>

      </div>


      <!-- Question -->

      <div
        id="questionText"
        class="muted"
      >
        Waiting for the host to start a question…
      </div>


      <!-- Status -->

      <div id="status"></div>


      <!-- =================================================
           A / B ANSWER
           ================================================= -->

      <div id="answerButtons">

        <button id="answerA" class="answer-btn" disabled>A</button>
        <button id="answerB" class="answer-btn" disabled>B</button>

      </div>


    </div>

  </div>

</div>


<div id="toast"></div>


<script src="/socket.io/socket.io.js"></script>

<script src="play.js"></script>

</body>
</html>
