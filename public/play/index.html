<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>QuizHub — Play</title>
<link rel="stylesheet" href="/shared/shared.css" />
<style>
  #joinScreen .form-group { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  #joinScreen input { width: 100%; box-sizing: border-box; }
  #gameScreen { display: none; }
  #questionText { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
  #status { min-height: 24px; }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--danger); color: #2b0a0a; padding: 10px 16px; border-radius: 10px;
    font-weight: 700; display: none; max-width: 90vw; text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <h1>QuizHub</h1>

  <div id="joinScreen" class="card">
    <h2>Join Your Team</h2>
    <p class="muted">Enter your name and the team name given to you by the game master.</p>
    
    <div class="form-group">
      <input type="text" id="playerName" placeholder="Your Name" maxlength="30" autocomplete="off" />
      <input type="text" id="teamName" placeholder="Team Name" maxlength="40" autocomplete="off" />
      <button id="joinBtn">Join Game</button>
    </div>
  </div>

  <div id="gameScreen">
    <div class="card row" style="justify-content: space-between;">
      <div><span class="muted">Playing as</span> <strong id="myPlayerName"></strong> <span class="muted">on</span> <strong id="myTeamName"></strong></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <span class="badge" id="phaseBadge">—</span>
        <span class="timer" id="timer"></span>
      </div>
      <div id="questionText" class="muted">Waiting for the host to start a question…</div>
      <div id="status" class="muted"></div>
      <textarea id="answerInput" rows="3" placeholder="Type your answer…" disabled></textarea>
      <div class="row" style="margin-top:10px;">
        <button id="submitBtn" disabled>Submit answer</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="play.js"></script>
</body>
</html>
