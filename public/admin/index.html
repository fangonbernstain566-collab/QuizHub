<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuizHub — Admin</title>
<link rel="stylesheet" href="/shared/shared.css" />
<style>
  .container { max-width: 1400px; padding: 0 24px 60px; }

  /* ---- Control bar ---- */
  .control-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    border-radius: 0;
    border-left: none;
    border-right: none;
    border-top: none;
    background: var(--bg);
    margin-bottom: 0;
  }

  .control-bar-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .control-bar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .control-bar-left .brand {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    white-space: nowrap;
  }

  .phase-pill {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .phase-pill span.label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  #phaseBadge { font-size: 13px; padding: 6px 14px; }
  #currentQuestionLabel { font-size: 13px; }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-row button { padding: 12px 18px; font-size: 12px; }

  /* ---- Page grid: workflow + sidebar ---- */
  .page-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 24px;
    margin-top: 24px;
    align-items: start;
  }
  @media (max-width: 960px) {
    .page-grid { grid-template-columns: 1fr; }
  }

  .main-col, .side-col {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card { padding: 24px; }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .section-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .section-desc {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* ---- Start question ---- */
  .field-row {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group input { font-size: 16px; padding: 12px 14px; }
  .field-group input[type=number] { font-family: var(--font-mono); }
  #startQuestionBtn { padding: 12px 22px; font-size: 13px; }

  /* ---- Scoring ---- */
  #scoringCard { display: none; }
  #scoringGrid {
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  #scoringGrid .answer-tile {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
  }
  #scoringGrid .answer-tile .team-label { font-size: 11px; }
  #scoringGrid .answer-tile .answer-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }
  #scoringGrid .answer-tile .score-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #scoringGrid .answer-tile input[type=number] {
    width: 76px;
    font-family: var(--font-mono);
    padding: 10px;
  }
  #scoringGrid .answer-tile .score-row button { flex: 1; padding: 10px; font-size: 11px; }

  /* ---- Teams ---- */
  #teamsCard .row { margin-bottom: 16px; }
  #teamsCard input { padding: 12px 14px; font-size: 14px; }
  #addTeamBtn { padding: 12px 18px; font-size: 12px; }
  #teamsBody .status-cell { width: 100px; }
  #teamsBody .players-cell { width: 60px; text-align: right; font-family: var(--font-mono); color: var(--muted); }

  /* ---- Scoreboard ---- */
  #scoreboardCard table { font-size: 14px; }
  #scoreboardBody .rank-cell { font-family: var(--font-mono); color: var(--muted); width: 24px; }
  #scoreboardBody td:last-child { text-align: right; font-family: var(--font-mono); font-weight: 700; font-size: 16px; }
</style>
</head>
<body>

<!-- Sticky control bar -->
<div class="card control-bar">
  <div class="control-bar-inner">
    <div class="control-bar-left">
      <span class="brand">QuizHub — GM</span>
      <div class="phase-pill">
        <span class="label">Phase</span>
        <span class="badge" id="phaseBadge">—</span>
      </div>
      <span class="muted" id="currentQuestionLabel"></span>
    </div>
    <div class="btn-row">
      <button id="startAnsweringBtn" class="primary" disabled>Start answering</button>
      <button id="revealBtn" disabled>Reveal answers</button>
      <button id="finalizeBtn" disabled>Finalize scoring</button>
      <button id="nextQuestionBtn" class="secondary" disabled>Next round →</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="page-grid">

    <!-- Main workflow column -->
    <div class="main-col">

      <div class="card" id="startQuestionCard">
        <p class="section-label">Step</p>
        <p class="section-title">Start question</p>
        <p class="section-desc">Questions are narrated aloud — the server just tracks the round, timer, and answers.</p>
        <div class="field-row">
          <div class="field-group">
            <label for="startRound">Round #</label>
            <input type="number" id="startRound" value="1" min="1" style="width: 100px;" />
          </div>
          <div class="field-group">
            <label for="startTime">Time limit (sec)</label>
            <input type="number" id="startTime" value="30" min="5" style="width: 140px;" />
          </div>
          <button id="startQuestionBtn" class="primary">Start question</button>
        </div>
      </div>

      <div class="card" id="scoringCard">
        <p class="section-label">Step</p>
        <p class="section-title">Score this question</p>
        <p class="section-desc">Award points per team, then finalize to lock scores in.</p>
        <div class="grid" id="scoringGrid"></div>
      </div>

    </div>

    <!-- Sidebar: teams + scoreboard -->
    <div class="side-col">

      <div class="card" id="teamsCard">
        <p class="section-title" style="font-size: 15px; margin-bottom: 16px;">Teams</p>
        <div class="row">
          <input type="text" id="newTeamName" placeholder="Team name" maxlength="40" style="flex: 1;" />
          <button id="addTeamBtn">Add</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Team</th>
              <th class="status-cell">Status</th>
              <th class="players-cell">#</th>
            </tr>
          </thead>
          <tbody id="teamsBody"></tbody>
        </table>
      </div>

      <div class="card" id="scoreboardCard">
        <p class="section-title" style="font-size: 15px; margin-bottom: 16px;">Scoreboard</p>
        <table>
          <thead>
            <tr>
              <th style="width: 24px;"></th>
              <th>Team</th>
              <th style="text-align: right;">Score</th>
            </tr>
          </thead>
          <tbody id="scoreboardBody"></tbody>
        </table>
      </div>

    </div>

  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="admin.js"></script>
</body>
</html>
